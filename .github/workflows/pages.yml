name: Sitio en GitHub Pages

# Publica la portada de estudiantes, el visor 3D y el inventario en
# https://gabrielbengoechea.github.io/xr-logistica-lab/ (sin backend: ver web-dashboard/README.md).
on:
  push:
    branches: [main]
    paths: ["web-dashboard/**", "models/**", "backend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar el tablero en modo sitio estático
        working-directory: web-dashboard
        env:
          XRLAB_BASE: /xr-logistica-lab/
          VITE_SITIO_ESTATICO: "1"
        run: |
          npm ci
          npx vite build
      - name: Exportar el manifest, el inventario y los modelos
        run: |
          python -m pip install -q -r backend/requirements-dev.txt
          python backend/tools/exportar_sitio.py web-dashboard/dist
      - name: Publicar en la rama gh-pages
        working-directory: web-dashboard/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar el sitio desde ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
